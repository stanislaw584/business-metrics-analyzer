[alembic]
script_location = migrations
prepend_sys_path = .
# Реальный адрес БД берётся из переменной DATABASE_URL (см. migrations/env.py);
# значение ниже используется, если переменная не задана.
sqlalchemy.url = sqlite:///./business_metrics.db
# Для PostgreSQL:
# sqlalchemy.url = postgresql+psycopg2://bma_user:bma_pass@localhost:5432/business_metrics

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
